name: Daily Dashboard Update

on:
  schedule:
    # 每天 08:30 台灣時間（UTC+8）= 00:30 UTC，週一至週五
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    # 允許在 GitHub 網頁手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate daily news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_news.py

      - name: Generate chips report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_chips.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/daily_news.json results/chips_report.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update results $(date +'%Y/%m/%d' -d '+8 hours')"
            git push
          fi
