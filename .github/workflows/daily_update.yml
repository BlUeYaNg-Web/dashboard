name: Daily Dashboard Update

on:
  schedule:
    # 每天 16:00 台灣時間（UTC+8）= 08:00 UTC，週一至週五
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai requests

      - name: Generate daily news
        id: news
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_news.py

      - name: Generate chips report
        id: chips
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_chips.py

      - name: Generate forex rates
        id: forex
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_forex.py

      - name: Show step results
        run: |
          echo "news:  ${{ steps.news.outcome }}"
          echo "chips: ${{ steps.chips.outcome }}"
          echo "forex: ${{ steps.forex.outcome }}"

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/daily_news.json results/chips_report.json results/forex_report.json results/forex_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update results $(TZ=Asia/Taipei date +'%Y/%m/%d %H:%M')"
            git push
          fi
