<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務儀表板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
    background: #1a1f35; color: #c8d0e8; min-height: 100vh;
  }

  /* ── Navbar ── */
  .navbar {
    padding: 24px 40px 0;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .navbar-eyebrow { width: 28px; height: 2px; background: linear-gradient(90deg,#4A90D9,#27AE60); border-radius: 2px; margin-bottom: 10px; }
  .navbar h1 { font-size: 22px; font-weight: 700; color: #eef2ff; letter-spacing: 3px; }
  .navbar-right { display: flex; align-items: center; gap: 14px; padding-bottom: 2px; }
  .time { font-size: 12px; color: #4a5580; }
  .refresh-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #5a6590; padding: 5px 16px; border-radius: 20px;
    cursor: pointer; font-size: 12px; transition: all 0.2s;
  }
  .refresh-btn:hover { background: rgba(74,144,217,0.15); border-color: rgba(74,144,217,0.4); color: #7aaede; }

  /* ── 主格線 3欄 ── */
  .main-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 24px 40px 48px;
    align-items: start;
  }

  /* ── 每欄結構 ── */
  .column { display: flex; flex-direction: column; gap: 0; }

  /* ── 卡片 ── */
  .portal-card {
    border-radius: 14px 14px 0 0; overflow: hidden;
    background: #222844; border: 1px solid rgba(255,255,255,0.08);
    border-bottom: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .color-bar { height: 3px; }
  .card-cover {
    height: 155px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .card-cover::after { content:''; position:absolute; bottom:0; left:0; right:0; height:50px; background:linear-gradient(transparent,rgba(0,0,0,0.3)); }

  /* 封面樣式 */
  .cover-news { background: linear-gradient(135deg,#0c1828,#0f2040,#0a1830); }
  .cover-bg-lines { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; justify-content:center; gap:9px; padding:20px; opacity:0.08; }
  .cover-bg-lines span { height:7px; background:#fff; border-radius:4px; display:block; }
  .cover-center { position:relative; text-align:center; z-index:1; }
  .cover-icon { font-size:36px; display:block; margin-bottom:8px; }
  .cover-label { font-size:9px; letter-spacing:5px; font-weight:700; text-transform:uppercase; }

  .cover-chips { background: linear-gradient(135deg,#081510,#0d2218,#091a10); flex-direction:column; padding-top:18px; }
  .cover-bars-wrap { position:relative; }
  .cover-taiex { position:absolute; top:-24px; right:0; font-size:18px; font-weight:800; color:#e74c3c; text-shadow:0 0 16px rgba(231,76,60,0.5); }
  .cover-bars { display:flex; align-items:flex-end; gap:5px; height:70px; }
  .bar { width:14px; border-radius:3px 3px 0 0; }
  .bar-up { background:linear-gradient(180deg,#e74c3c,#c0392b); }
  .bar-down { background:linear-gradient(180deg,#27AE60,#1e8449); }

  .cover-pptx { background:linear-gradient(135deg,#130e04,#1e1608,#15100504); }
  .cover-building { display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
  .building-glow { position:absolute; width:120px; height:80px; background:radial-gradient(circle,rgba(230,126,34,0.18) 0%,transparent 70%); top:50%; left:50%; transform:translate(-50%,-40%); }
  .building-top { width:50px; height:6px; background:linear-gradient(90deg,#E67E22,#f39c12); border-radius:2px; margin-bottom:4px; }
  .building-body { width:68px; height:68px; background:#1e1508; border:1px solid rgba(230,126,34,0.4); border-radius:4px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:7px; }
  .building-window { background:rgba(230,126,34,0.3); border-radius:1px; }
  .building-window.lit { background:#f39c12; box-shadow:0 0 5px rgba(243,156,18,0.6); }

  .card-body { padding:14px 18px 16px; }
  .card-meta { font-size:10px; color:#3a4260; margin-bottom:5px; }
  .card-title { font-size:14px; font-weight:700; color:#eef2ff; margin-bottom:4px; }
  .card-status { margin-top:10px; display:flex; align-items:center; }
  .status-dot { width:5px; height:5px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot-ok { background:#27AE60; box-shadow:0 0 6px rgba(39,174,96,0.6); }
  .dot-empty { background:#2e3450; }
  .status-text { font-size:10px; color:#3a4260; }
  .status-text.ok { color:#3d8a55; }

  /* ── 子分頁列 ── */
  .sub-tabs {
    display: flex; gap: 2px;
    background: #1e2440; padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none; border-bottom: none;
  }
  .sub-tab {
    flex: 1; text-align: center;
    padding: 6px 4px; border-radius: 6px;
    font-size: 11px; font-weight: 600; color: #3a4260;
    cursor: pointer; transition: all 0.18s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    user-select: none;
  }
  .sub-tab:hover { background: rgba(255,255,255,0.05); color: #8a9ab5; }
  .sub-tab.active { background: var(--col-color-bg); color: var(--col-color); }

  /* ── 詳細面板 ── */
  .detail-panel {
    background: #222844; border: 1px solid rgba(255,255,255,0.08);
    border-top: none; border-radius: 0 0 14px 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .detail-body {
    padding: 16px 18px;
    overflow-y: auto; max-height: 520px;
    scrollbar-width: thin; scrollbar-color: #2a3050 transparent;
  }
  .detail-body::-webkit-scrollbar { width: 3px; }
  .detail-body::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 4px; }

  .sub-content { display: none; }
  .sub-content.active { display: block; }

  /* ── 資料元件 ── */
  .meta-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .meta-item { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:8px; padding:9px 12px; flex:1; min-width:80px; }
  .meta-label { font-size:9px; color:#3a4260; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:3px; }
  .meta-value { font-size:14px; color:#eef2ff; font-weight:700; }

  .news-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:8px; padding:11px 13px; margin-bottom:7px; transition:background 0.2s; }
  .news-item:hover { background:rgba(255,255,255,0.06); }
  .news-title { font-size:14px; color:#dde6ff; font-weight:700; margin-bottom:5px; line-height:1.5; }
  .news-summary { font-size:11px; color:#a0b0cc; line-height:1.7; margin-bottom:5px; }
  .news-meta-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .news-source { font-size:10px; color:#7888a8; }
  .news-analysis { font-size:10px; color:#8898b8; margin-top:7px; padding-top:7px; border-top:1px solid rgba(255,255,255,0.08); line-height:1.6; }
  .news-links { display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .news-link { font-size:10px; padding:2px 9px; border-radius:10px; text-decoration:none; font-weight:600; transition:all 0.2s; }
  .news-link-orig { background:rgba(74,144,217,0.15); color:#7aaede; border:1px solid rgba(74,144,217,0.3); }
  .news-link-orig:hover { background:rgba(74,144,217,0.3); color:#aad4f5; }
  .news-link-trans { background:rgba(39,174,96,0.12); color:#4dc890; border:1px solid rgba(39,174,96,0.28); }
  .news-link-trans:hover { background:rgba(39,174,96,0.25); color:#7de8b0; }

  .value-up { color:#e05c5c; font-weight:700; }
  .value-down { color:#4dc880; font-weight:700; }

  .pptx-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .pptx-case { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:8px; padding:10px 12px; transition:background 0.2s; }
  .pptx-case:hover { background:rgba(255,255,255,0.06); }
  .case-row1 { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.07); }
  .case-name { font-size:13px; color:#9aaac8; font-weight:700; }
  .case-price { font-size:12px; color:#7aaede; font-weight:600; text-align:right; }
  .case-row2 { display:flex; justify-content:space-between; align-items:flex-end; }
  .case-new-block {}
  .case-weekly { font-size:17px; font-weight:800; color:#E67E22; line-height:1.2; }
  .case-label { font-size:9px; color:#6878a0; margin-top:2px; }
  .case-weeks { font-size:10px; color:#7888a8; text-align:right; }
  .case-weeks-line { display:flex; align-items:baseline; justify-content:flex-end; gap:2px; }
  .weeks-num { font-size:15px; font-weight:700; color:#8898c0; }
  .weeks-alert .weeks-num { font-size:20px; font-weight:800; color:#e74c3c; }
  .weeks-sub { font-size:9px; color:#6878a0; margin-top:1px; text-align:right; }

  .verdict-badge { font-size:10px; padding:2px 8px; border-radius:8px; font-weight:600; white-space:nowrap; }
  .verdict-ok { background:rgba(39,174,96,0.15); color:#4dc880; border:1px solid rgba(39,174,96,0.3); }
  .verdict-warn { background:rgba(255,193,7,0.15); color:#d4a017; border:1px solid rgba(255,193,7,0.3); }
  .verdict-no { background:rgba(231,76,60,0.15); color:#e05c5c; border:1px solid rgba(231,76,60,0.3); }

  .disclaimer { margin-top:12px; padding:9px 12px; background:rgba(255,255,255,0.02); border-radius:6px; border-left:2px solid #2a3050; font-size:10px; color:#3a4260; line-height:1.7; }
  .empty-state { text-align:center; padding:40px 10px; }
  .empty-state .icon { font-size:32px; margin-bottom:10px; opacity:0.2; }
  .empty-state p { font-size:11px; color:#3a4260; }
  .loading { text-align:center; padding:40px; color:#3a4260; font-size:11px; }

  .section-label { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin:12px 0 8px; display:flex; align-items:center; gap:6px; }
  .section-label::before { content:''; display:block; width:3px; height:10px; background:currentColor; border-radius:2px; }
</style>
</head>
<body>

<div class="navbar">
  <div>
    <div class="navbar-eyebrow"></div>
    <h1>任務儀表板</h1>
  </div>
  <div class="navbar-right">
    <span class="time" id="now-time"></span>
    <button class="refresh-btn" onclick="location.reload()">⟳ 重新整理</button>
  </div>
</div>

<div class="main-grid">

  <!-- ══ 欄1：每日財經新聞 ══ -->
  <div class="column" style="--col-color:#4A90D9; --col-color-bg:rgba(74,144,217,0.15);">
    <div class="portal-card">
      <div class="color-bar" style="background:#4A90D9;"></div>
      <div class="card-cover cover-news">
        <div class="cover-bg-lines">
          <span style="width:88%"></span><span style="width:65%"></span><span style="width:78%"></span>
          <span style="width:55%"></span><span style="width:72%"></span><span style="width:48%"></span>
          <span style="width:82%"></span>
        </div>
        <div class="cover-center">
          <span class="cover-icon" style="filter:drop-shadow(0 4px 12px rgba(74,144,217,0.5));">📰</span>
          <div class="cover-label" style="color:#5a8fc4;">Daily Briefing</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-meta">⏰ 每天早上 09:00</div>
        <div class="card-title">每日財經新聞摘要</div>
        <div class="card-status">
          <span class="status-dot dot-empty" id="dot-news"></span>
          <span class="status-text" id="status-news">載入中...</span>
        </div>
      </div>
    </div>
    <div class="sub-tabs">
      <div class="sub-tab active" onmouseenter="switchSub('news','tw')">台灣財經</div>
      <div class="sub-tab" onmouseenter="switchSub('news','intl')">國際重大</div>
      <div class="sub-tab" onmouseenter="switchSub('news','realty')">房地產</div>
      <div class="sub-tab" onmouseenter="switchSub('news','china')">中國財經</div>
    </div>
    <div class="detail-panel">
      <div class="detail-body">
        <div class="sub-content active" id="news-tw"><div class="loading">載入中...</div></div>
        <div class="sub-content" id="news-intl"></div>
        <div class="sub-content" id="news-realty"></div>
        <div class="sub-content" id="news-china"></div>
      </div>
    </div>
  </div>

  <!-- ══ 欄2：台股籌碼 ══ -->
  <div class="column" style="--col-color:#27AE60; --col-color-bg:rgba(39,174,96,0.15);">
    <div class="portal-card">
      <div class="color-bar" style="background:#27AE60;"></div>
      <div class="card-cover cover-chips">
        <div class="cover-bars-wrap">
          <div class="cover-taiex">TAIEX</div>
          <div class="cover-bars">
            <div class="bar bar-up" style="height:38px"></div>
            <div class="bar bar-down" style="height:24px"></div>
            <div class="bar bar-up" style="height:58px"></div>
            <div class="bar bar-up" style="height:42px"></div>
            <div class="bar bar-down" style="height:16px"></div>
            <div class="bar bar-up" style="height:66px"></div>
            <div class="bar bar-down" style="height:28px"></div>
            <div class="bar bar-up" style="height:48px"></div>
          </div>
        </div>
        <div class="cover-label" style="color:#3d8a55;margin-top:10px;letter-spacing:4px;">Chips Report</div>
      </div>
      <div class="card-body">
        <div class="card-meta">⏰ 週一至週五 16:00</div>
        <div class="card-title">台股籌碼面報告</div>
        <div class="card-status">
          <span class="status-dot dot-empty" id="dot-chips"></span>
          <span class="status-text" id="status-chips">載入中...</span>
        </div>
      </div>
    </div>
    <div class="sub-tabs">
      <div class="sub-tab active" onmouseenter="switchSub('chips','overview')">大盤概況</div>
      <div class="sub-tab" onmouseenter="switchSub('chips','stocks')">熱門股票</div>
      <div class="sub-tab" onmouseenter="switchSub('chips','recommend')">推薦股票</div>
    </div>
    <div class="detail-panel">
      <div class="detail-body">
        <div class="sub-content active" id="chips-overview"><div class="loading">載入中...</div></div>
        <div class="sub-content" id="chips-stocks"></div>
        <div class="sub-content" id="chips-recommend"></div>
      </div>
    </div>
  </div>

  <!-- ══ 欄3：土城週報 ══ -->
  <div class="column" style="--col-color:#E67E22; --col-color-bg:rgba(230,126,34,0.15);">
    <div class="portal-card">
      <div class="color-bar" style="background:#E67E22;"></div>
      <div class="card-cover cover-pptx">
        <div class="building-glow"></div>
        <div class="cover-building">
          <div class="building-top"></div>
          <div class="building-body">
            <div class="building-window lit"></div><div class="building-window"></div><div class="building-window lit"></div>
            <div class="building-window"></div><div class="building-window lit"></div><div class="building-window lit"></div>
            <div class="building-window lit"></div><div class="building-window"></div><div class="building-window lit"></div>
          </div>
          <div class="cover-label" style="color:#8a5a1a;margin-top:10px;letter-spacing:4px;">Weekly Report</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-meta">⏰ 每週日 13:06</div>
        <div class="card-title">實價登錄</div>
        <div class="card-status">
          <span class="status-dot dot-empty" id="dot-pptx"></span>
          <span class="status-text" id="status-pptx">載入中...</span>
        </div>
      </div>
    </div>
    <div class="sub-tabs">
      <div class="sub-tab active" onmouseenter="switchSub('pptx','tucheng')">土城區</div>
    </div>
    <div class="detail-panel">
      <div class="detail-body">
        <div class="sub-content active" id="pptx-tucheng"><div class="loading">載入中...</div></div>
      </div>
    </div>
  </div>

</div>

<script>
const REPO = 'BlUeYaNg-Web/dashboard';
const BASE = `https://raw.githubusercontent.com/${REPO}/main/results`;

document.getElementById('now-time').textContent = new Date().toLocaleString('zh-TW',{
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'
});

// 子分頁切換
const subGroups = {
  news: ['tw','intl','realty','china'],
  chips: ['overview','stocks','recommend'],
  pptx: ['tucheng'],
};
function switchSub(group, id) {
  subGroups[group].forEach(s => {
    const el = document.getElementById(`${group}-${s}`);
    if (el) el.classList.remove('active');
  });
  const target = document.getElementById(`${group}-${id}`);
  if (target) target.classList.add('active');

  // 更新 sub-tab 樣式
  const col = target?.closest('.column');
  if (col) {
    col.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    const tabs = col.querySelectorAll('.sub-tab');
    const idx = subGroups[group].indexOf(id);
    if (tabs[idx]) tabs[idx].classList.add('active');
  }
}

async function fetchJSON(url) {
  try {
    const r = await fetch(url + '?t=' + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function setStatus(id, hasData) {
  const dot = document.getElementById('dot-' + id);
  const txt = document.getElementById('status-' + id);
  if (hasData) { dot.className='status-dot dot-ok'; txt.className='status-text ok'; txt.textContent='已有資料'; }
  else { dot.className='status-dot dot-empty'; txt.className='status-text'; txt.textContent='尚無資料'; }
}

function empty() { return `<div class="empty-state"><div class="icon">⏳</div><p>尚未執行或無資料</p></div>`; }

function newsItems(items, isIntl) {
  if (!items?.length) return empty();
  return items.map(item => {
    // 原文連結：優先用 item.url，否則 Google 搜尋
    const searchQ = encodeURIComponent((item.title||'') + ' ' + (item.source||''));
    const origUrl = item.url || `https://www.google.com/search?q=${searchQ}&tbs=qdr:d`;
    const origLabel = item.url ? '看原文 ↗' : '搜尋原文 🔍';

    // 翻譯連結（僅國外新聞）
    let transBtn = '';
    if (isIntl) {
      const transUrl = item.url
        ? `https://translate.google.com/translate?sl=auto&tl=zh-TW&u=${encodeURIComponent(item.url)}`
        : `https://translate.google.com/?sl=auto&tl=zh-TW&text=${encodeURIComponent(item.title||'')}`;
      transBtn = `<a class="news-link news-link-trans" href="${transUrl}" target="_blank" rel="noopener">中文翻譯 🌐</a>`;
    }

    return `<div class="news-item">
    <div class="news-title">${item.title||''}</div>
    <div class="news-summary">${item.summary||''}</div>
    <div class="news-meta-row">
      <span class="news-source">📌 ${item.source||''}</span>
      <span style="font-size:10px;color:#7888a8;">${item.credibility||''}</span>
    </div>
    ${item.analysis?`<div class="news-analysis">💡 ${item.analysis}</div>`:''}
    <div class="news-links">
      <a class="news-link news-link-orig" href="${origUrl}" target="_blank" rel="noopener">${origLabel}</a>
      ${transBtn}
    </div>
  </div>`;
  }).join('');
}

function renderNews(r) {
  if (!r) { ['tw','intl','realty','china'].forEach(s=>{ document.getElementById('news-'+s).innerHTML=empty(); }); return; }
  const cats = r.categories||{};
  const map = {
    tw:     cats['台灣財經新聞']||[],
    intl:   cats['國際重大新聞']||[],
    realty: cats['房地產新聞']||[],
    china:  cats['中國財經經濟新聞']||[],
  };
  const meta = `<div class="meta-row">
    <div class="meta-item"><div class="meta-label">更新時間</div><div class="meta-value" style="font-size:12px;">${r.fetched_at||'N/A'}</div></div>
    <div class="meta-item"><div class="meta-label">總則數</div><div class="meta-value">${r.total||0} 則</div></div>
  </div>`;
  document.getElementById('news-tw').innerHTML = meta + newsItems(map.tw, false);
  document.getElementById('news-intl').innerHTML = newsItems(map.intl, true);
  document.getElementById('news-realty').innerHTML = newsItems(map.realty, false);
  document.getElementById('news-china').innerHTML = newsItems(map.china, false);
}

function renderChips(r) {
  if (!r) { ['overview','stocks','recommend'].forEach(s=>{ document.getElementById('chips-'+s).innerHTML=empty(); }); return; }
  const fv = v => parseFloat(v)>0?`<span class="value-up">+${v} 億</span>`:`<span class="value-down">${v} 億</span>`;

  // 大盤概況
  let overview = `<div class="meta-row">
    <div class="meta-item"><div class="meta-label">日期</div><div class="meta-value">${r.date||'N/A'}</div></div>
    <div class="meta-item" style="flex:2"><div class="meta-label">大盤指數</div><div class="meta-value">${r.taiex||'N/A'}</div></div>
  </div>
  <div class="meta-row">
    <div class="meta-item"><div class="meta-label">外資</div><div class="meta-value">${fv(r.foreign||0)}</div></div>
    <div class="meta-item"><div class="meta-label">投信</div><div class="meta-value">${fv(r.investment_trust||0)}</div></div>
    <div class="meta-item"><div class="meta-label">自營商</div><div class="meta-value">${fv(r.dealer||0)}</div></div>
  </div>`;
  if (r.summary) overview += `<div class="news-item"><div class="news-title">今日摘要</div><div class="news-summary">${r.summary}</div></div>`;
  document.getElementById('chips-overview').innerHTML = overview;

  // 熱門股票（法人大買）
  let stocks = '';
  if (r.investment_advice?.length) {
    stocks = r.investment_advice.map(item => {
      const vc = item.verdict==='適合'?'verdict-ok':item.verdict==='謹慎'?'verdict-warn':'verdict-no';
      return `<div class="news-item">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
          <div class="news-title" style="margin:0;">${item.stock}</div>
          <span class="verdict-badge ${vc}">${item.verdict}</span>
        </div>
        <div class="news-summary">${item.reason}</div>
        ${item.risk?`<div class="news-analysis">⚠️ ${item.risk}</div>`:''}
      </div>`;
    }).join('');
  } else { stocks = empty(); }
  document.getElementById('chips-stocks').innerHTML = stocks;

  // 推薦股票
  let recommend = '';
  if (r.recommendations?.length) {
    recommend = r.recommendations.map(item => `<div class="news-item">
      <div class="news-title">${item.stock}</div>
      <div class="news-summary">${item.reason}</div>
      ${item.risk?`<div class="news-analysis">⚠️ ${item.risk}</div>`:''}
    </div>`).join('');
    if (r.disclaimer) recommend += `<div class="disclaimer">${r.disclaimer}</div>`;
  } else { recommend = empty(); }
  document.getElementById('chips-recommend').innerHTML = recommend;
}

function renderPptx(r) {
  if (!r) { document.getElementById('pptx-tucheng').innerHTML=empty(); return; }
  let html = `<div class="meta-row">
    <div class="meta-item"><div class="meta-label">執行時間</div><div class="meta-value" style="font-size:12px;">${r.run_at||'N/A'}</div></div>
    <div class="meta-item" style="flex:2"><div class="meta-label">檔案</div><div class="meta-value" style="font-size:11px;">${(r.output_file||'N/A').split('\\').pop()}</div></div>
  </div><div class="pptx-grid">`;
  for (const c of (r.cases||[])) {
    const priceStr = (c.latest_price != null && c.latest_area != null)
      ? `${c.latest_price}萬／坪・${c.latest_area}坪`
      : (c.latest_price != null ? `${c.latest_price}萬／坪` : '—');
    const wd = c.weeks_dry ?? null;
    const isAlert = wd != null && wd >= 4;
    const weeksHtml = wd != null
      ? `<div class="case-weeks${isAlert?' weeks-alert':''}">
           <div class="case-weeks-line">連續<span class="weeks-num">${wd}</span>週</div>
           <div class="weeks-sub">無實價登錄</div>
         </div>`
      : '';
    html += `<div class="pptx-case">
      <div class="case-row1">
        <div class="case-name">${c.name}</div>
        <div class="case-price">${priceStr}</div>
      </div>
      <div class="case-row2">
        <div class="case-new-block">
          <div class="case-weekly">+${c.weekly_new}</div>
          <div class="case-label">本週新增（戶）</div>
        </div>
        ${weeksHtml}
      </div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('pptx-tucheng').innerHTML = html;
}

async function loadAll() {
  const [news, chips, pptx] = await Promise.all([
    fetchJSON(`${BASE}/daily_news.json`),
    fetchJSON(`${BASE}/chips_report.json`),
    fetchJSON(`${BASE}/pptx_update.json`),
  ]);
  setStatus('news', !!news); renderNews(news);
  setStatus('chips', !!chips); renderChips(chips);
  setStatus('pptx', !!pptx); renderPptx(pptx);
}

loadAll();
</script>
</body>
</html>
